name: app_odontologia
description: "DentalCare - Plataforma odontológica unificada con odontograma interactivo, RX y gestión clínica."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend & Cloud
  supabase_flutter: ^2.8.0

  # Navegación & Estado
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1

  # UI & Componentes Clínicos
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  signature: ^5.5.0
  photo_view: ^0.15.0
  table_calendar: ^3.1.2
  crypto: ^3.0.3

  # Utilidades
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
